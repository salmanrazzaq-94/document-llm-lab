[project]
name = "document-llm-lab"
version = "0.2.0"
description = "Learn local LoRA fine-tuning through lease PDF extraction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-lm[train]>=0.31,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pdfplumber>=0.11,<0.12",
  "pydantic>=2.12,<3",
  "reportlab>=4.4,<5",
  "huggingface-hub>=0.36,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
lease-lab = "lease_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lease_lab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
